[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tellbench"
version = "0.0.1"
description = "Disposition-profile benchmark for LLM agents: propensity measurement over agentic traces"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "inspect-ai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
